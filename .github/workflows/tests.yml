name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  oeh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install -r requirements-difficulty.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q code scripts tests

      - name: Run full suite without skips and enforce branch coverage
        run: |
          python -m coverage run -m scripts.testing.run_full_tests
          python -m coverage report

      - name: Audit published OEH evidence and unchanged scientific definitions
        run: python -m scripts.analysis.verify_oeh

      - name: Verify Week 8 D1 metrics and access-separated tables
        run: python -m scripts.analysis.export_week8_d1 --check

  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install paper dependencies
        run: |
          python -m pip install -r requirements-difficulty.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-publishers texlive-pictures poppler-utils

      - name: Verify evidence and paper tables
        run: |
          python -m scripts.analysis.verify_oeh
          python -m scripts.analysis.export_paper_tables --check
          python -m scripts.analysis.export_difficulty_table --check
          python -m scripts.analysis.export_unseen_difficulty_table --check

      - name: Build IEEE paper and enforce page budget
        run: bash paper/build.sh
